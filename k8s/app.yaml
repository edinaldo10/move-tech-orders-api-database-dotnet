apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-application
  labels:
    app: cloud-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-application
  template:
    metadata:
      labels:
        app: cloud-application
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: cloud-application
        image: container-registry.br-se1.magalu.cloud/${MGC_REGISTRY_NAME}/cloud-application-dotnet:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-application
spec:
  selector:
    app: cloud-application
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP