name: Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: cloud-application-dotnet
  DOTNET_VERSION: '8.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restaurar dependências da API
      run: dotnet restore CloudApplication.csproj # restore-api
      working-directory: ./dotnet

    - name: Compilar projeto da API
      run: dotnet build CloudApplication.csproj --no-restore --configuration Release
      working-directory: ./dotnet

    - name: Restaurar e Executar testes
      run: dotnet test CloudApplication-tests.csproj --configuration Release --verbosity normal
      working-directory: ./tests

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login no Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.MGC_REGISTRY_USER }}
        password: ${{ secrets.MGC_REGISTRY_PASSWORD }}

    - name: Build e push da imagem
      run: |
        REGISTRY_NAME="${{ secrets.MGC_REGISTRY_NAME }}"
        if [ -z "$REGISTRY_NAME" ]; then
          echo "Erro: O secret MGC_REGISTRY_NAME nao esta definido ou esta vazio!"
          exit 1
        fi
        BASE="${{ env.REGISTRY }}/$REGISTRY_NAME/${{ env.IMAGE_NAME }}"
        docker build --no-cache -t $BASE:${{ github.sha }} -t $BASE:latest -f dotnet/Dockerfile dotnet
        docker push $BASE:${{ github.sha }}
        docker push $BASE:latest

    - name: Configurar kubectl
      run: |
        echo "${{ secrets.MGC_KUBECONFIG }}" > kubeconfig.yaml

    - name: Criar Secret do registry
      run: |
        export KUBECONFIG=kubeconfig.yaml
        kubectl create secret docker-registry registry-secret --docker-server=${{ env.REGISTRY }} --docker-username=${{ secrets.MGC_REGISTRY_USER }} --docker-password=${{ secrets.MGC_REGISTRY_PASSWORD }} --dry-run=client -o yaml | kubectl apply -n default -f -

    - name: Criar Secret do banco
      run: |
        export KUBECONFIG=kubeconfig.yaml
        kubectl create secret generic db-secret \
          --from-literal=url=${{ secrets.DATABASE_URL }} \
          --dry-run=client -o yaml | kubectl apply -n default -f -

    - name: Deploy no Kubernetes
      run: |
        export KUBECONFIG=kubeconfig.yaml
        export MGC_REGISTRY_NAME=${{ secrets.MGC_REGISTRY_NAME }}
        export IMAGE_TAG=${{ github.sha }}
        envsubst '$MGC_REGISTRY_NAME $IMAGE_TAG' < dotnet/k8s/deployment.yaml | kubectl apply -f -
        kubectl rollout status deployment/cloud-application -n default
